<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#666;--line:#e3e3e3;--card:#f6f6f6;--inv:#0a0a0a;--invfg:#fff}
[data-theme=dark]{--bg:#000;--fg:#f4f4f4;--mut:#9a9a9a;--line:#232323;--card:#0d0d0d;--inv:#f4f4f4;--invfg:#000}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:78px;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;font-weight:400;background:var(--bg);color:var(--fg);line-height:1.7;transition:background .4s,color .4s;overflow-x:clip}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
section{padding:96px 0}
h1,h2,h3{line-height:1.3;font-weight:800}
h1,h2,h3,p,li{overflow-wrap:break-word}
.grid>*,.about>*,.contact>*{min-width:0}
img,svg{max-width:100%}
h2{font-size:clamp(28px,4vw,42px);margin-bottom:12px}
.sub{color:var(--mut);max-width:560px;margin-bottom:48px}

/* logo */
.logo{direction:ltr;display:inline-flex;align-items:center;line-height:0;color:inherit}
.logo svg{display:block;height:100%;width:auto;overflow:visible}

/* loader */
#loader{position:fixed;inset:0;z-index:99;background:#000;color:#fff;display:grid;place-items:center;transition:opacity .8s ease,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#loader .logo{width:min(84vw,760px);height:auto}
#loader .logo svg{width:100%;height:auto}
/* part 1: Q starts centered, then slides left */
#loader .pq{transform:translateX(1082px);animation:fadeq .6s ease both;transition:transform 1.4s cubic-bezier(.65,0,.25,1)}
#loader.go .pq{transform:none}
@keyframes fadeq{from{opacity:0}to{opacity:1}}
/* part 2: chain is drawn left to right through a mask */
#loader .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease-in-out .5s}
#loader.go .mk{stroke-dashoffset:0}
/* part 3: "Link" letters ease in after the chain */
#loader .l{opacity:0;transform:translateX(-100px);transition:opacity .6s ease var(--d),transform .8s cubic-bezier(.2,.7,.2,1) var(--d)}
#loader.go .l{opacity:1;transform:none}

/* nav */
header{position:fixed;top:0;inset-inline:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
nav .logo{height:40px}
.links{display:flex;gap:24px;font-size:14px;font-weight:500;color:var(--mut)}
.links a{display:inline-flex;align-items:center;gap:7px}
.links a:hover{color:var(--fg)}
.links svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;gap:8px;align-items:center}
.ib{height:34px;min-width:34px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;display:grid;place-items:center;transition:.25s}
.ib:hover{background:var(--inv);color:var(--invfg);transform:translateY(-2px)}
.ib svg{width:16px;height:16px}
[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
.sun{display:none}
[data-theme=light] .moon{display:block}
.burger{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:99px;background:var(--inv);color:var(--invfg);font-weight:700;border:1px solid var(--inv);cursor:pointer;font-family:inherit;font-size:16px;transition:transform .25s,box-shadow .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px -10px var(--fg)}
.btn:active{transform:scale(.97)}
.btn.o{background:none;color:var(--fg);border-color:var(--line)}
.btn.o:hover{background:var(--inv);color:var(--invfg)}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:120px;position:relative}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0,transparent 70%);mask-image:radial-gradient(ellipse at 50% 40%,#000 0,transparent 70%);opacity:.7}
.hero .wrap{position:relative}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(30px,4.4vw,54px);max-width:640px;letter-spacing:-.01em;margin-bottom:18px}
.hero p{font-size:clamp(15px,1.5vw,18px);color:var(--mut);max-width:520px;margin-bottom:30px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}
.eb{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:99px;padding:5px 15px;font-size:13px;color:var(--mut);margin-bottom:20px}
.eb i{width:7px;height:7px;border-radius:50%;background:var(--fg);animation:pulse 1.8s ease-in-out infinite}
.ri{animation:rise .9s cubic-bezier(.2,.7,.2,1) calc(2.6s + var(--i,0)*.12s) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.vis{position:relative;width:100%;max-width:440px;height:480px;margin-inline:auto;display:grid;place-items:center}
.orb{position:absolute;aspect-ratio:1;border-radius:50%;border:1px dashed var(--line);animation:spin 40s linear infinite}
.o1{width:min(420px,100%)}.o2{width:min(310px,80%);animation-duration:28s;animation-direction:reverse}
.orb::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--fg)}
.phone{position:relative;z-index:2;width:230px;height:430px;border:2px solid var(--fg);border-radius:36px;background:var(--bg);padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px -30px color-mix(in srgb,var(--fg) 45%,transparent);animation:fl 6s ease-in-out infinite}
.ph-top{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.ph-top .logo{height:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg);animation:pulse 1.8s ease-in-out infinite}
.sk{background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--fg) 22%,var(--line)) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 2.6s linear infinite}
.ph-hero{height:110px;border-radius:18px}
.ph-row{display:flex;align-items:center;gap:10px}
.ph-row>div{flex:1;display:grid;gap:7px}
.ph-row b{display:block;height:8px;border-radius:6px}.w60{width:60%}.w40{width:40%}
.th{width:42px;height:42px;border-radius:12px;flex:none}
.pr{width:32px;height:16px;border-radius:99px;background:var(--fg);flex:none}
.ph-btn{height:38px;border-radius:99px;background:var(--inv);margin-top:auto}
.fc{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;box-shadow:0 14px 40px -18px #000;animation:fl 5s ease-in-out infinite}
.qr svg{display:block;width:34px;height:34px}
.fq{top:28px;inset-inline-start:0}
.fn{top:47%;inset-inline-end:0}
.fs{bottom:46px;inset-inline-start:4px}
.ft{top:84px;inset-inline-end:6px}
.nf{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--inv);color:var(--invfg)}
.nf::before,.nf::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--fg);animation:ring 2.4s ease-out infinite}
.nf::after{animation-delay:1.2s}
.ok{width:20px;height:20px;border-radius:50%;background:var(--inv);color:var(--invfg);display:grid;place-items:center;font-size:11px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:14px;color:var(--mut)}

/* about */
.about>div{max-width:720px}
.about p{color:var(--mut);font-size:18px}

/* cards */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr;margin-bottom:24px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:30px;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:var(--fg)}
.card .ic{width:52px;height:52px;border-radius:14px;background:var(--inv);color:var(--invfg);display:grid;place-items:center;margin-bottom:22px;transition:transform .4s}
.card:hover .ic{transform:rotate(-8deg) scale(1.08)}
.ic svg{width:26px;height:26px}
.card h3{font-size:20px;margin-bottom:8px}.card p{color:var(--mut);font-size:15px}

/* portfolio */
.pf{padding:0;overflow:hidden}
.shot{height:200px;border-bottom:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,var(--card),var(--card) 12px,var(--bg) 12px,var(--bg) 24px)}
.mock{width:62%;height:74%;border:1px solid var(--fg);border-radius:12px 12px 0 0;background:var(--bg);align-self:end;padding:12px;display:grid;gap:7px;align-content:start;transition:transform .4s}
.pf:hover .mock{transform:translateY(-10px)}
.mock i{display:block;height:8px;border-radius:4px;background:var(--line)}.mock i:first-child{width:40%;background:var(--fg)}.mock i:nth-child(3){width:70%}
.pf .in{padding:24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pf h3{font-size:18px}.pf small{color:var(--mut)}
.pv{font-size:14px;font-weight:700;border-bottom:1px solid var(--fg);white-space:nowrap}

/* pricing */
.setup{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border:1px dashed var(--fg);border-radius:20px;padding:20px 28px;margin-bottom:24px}
.setup b{font-size:28px}
.price{display:flex;flex-direction:column;position:relative}
.price.hot{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.price.hot p,.price.hot .per{color:inherit;opacity:.7}
.price .amt{font-size:48px;font-weight:700;line-height:1.1;margin:14px 0 4px;direction:ltr;text-align:start}
.price .was{font-size:18px;text-decoration:line-through;opacity:.5;font-weight:400;margin-inline-start:8px}
.per{color:var(--mut);font-size:14px;margin-bottom:22px}
.price ul{list-style:none;margin-bottom:28px;flex:1;font-size:15px}
.price li{padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.price.hot li{border-color:#8884}
.price li::before{content:"✓";font-weight:700}
.price .btn{justify-content:center}
.price.hot .btn{background:var(--invfg);color:var(--inv);border-color:var(--invfg)}
.price:not(.hot) .tag{background:var(--inv);color:var(--invfg)}
.price li.hl{font-weight:700;background:color-mix(in srgb,currentColor 11%,transparent);border-radius:12px;padding:10px 12px;margin:6px -12px;border-top-color:transparent}
.price li.hl span{display:flex;flex-direction:column}
.price li.hl small{font-weight:400;font-size:13px;opacity:.75}
.price li.dom{flex-direction:column;gap:3px;border:1px dashed currentColor;border-radius:12px;padding:10px 12px;margin-top:8px;align-items:flex-start}
.price li.dom::before,.price li.hl::before{content:none}
.price li.dom b{direction:ltr;unicode-bidi:isolate;font-size:15px}
.price li.dom small{opacity:.75;font-size:13px}
.bd{font-size:11px;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--inv);color:var(--invfg)}
.price.hot .bd{background:var(--invfg);color:var(--inv)}
.faq{max-width:820px;display:grid;gap:12px}
.faq details{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:0 24px;transition:border-color .3s}
.faq details[open]{border-color:var(--fg)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;transition:transform .3s;flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{color:var(--mut);padding-bottom:20px;white-space:pre-line}
.tag{position:absolute;top:18px;inset-inline-end:18px;font-size:12px;padding:3px 12px;border-radius:99px;background:var(--invfg);color:var(--inv);font-weight:700}

/* contact */
.socials{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.soc{max-width:100%;display:inline-flex;align-items:center;height:64px;border:1px solid var(--line);background:var(--card);border-radius:99px;overflow:hidden;transition:background .3s,color .3s,border-color .3s}
.soc button{width:64px;height:64px;flex:none;border:0;background:none;color:inherit;cursor:pointer;display:grid;place-items:center}
.soc svg{width:26px;height:26px}
.soc a{max-width:0;opacity:0;white-space:nowrap;direction:ltr;font-weight:500;padding-inline-end:0;transition:max-width .5s cubic-bezier(.6,0,.2,1),opacity .4s,padding .5s}
.soc:hover,.soc:focus-within,.soc.open{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.soc:hover a,.soc:focus-within a,.soc.open a{max-width:min(300px,calc(100vw - 150px));opacity:1;padding-inline-end:28px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
form{display:grid;gap:14px}
input,textarea{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--fg)}
textarea{min-height:120px;resize:vertical}
.note{color:var(--mut);font-size:14px}

footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mut);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
footer .logo{height:24px;color:var(--fg)}

.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}

@media(min-width:1600px){.wrap{max-width:1360px}section{padding:120px 0}.hero h1{max-width:1100px}}
@media(min-width:2200px){.wrap{max-width:1600px}.hero p{max-width:760px}}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:1060px){.burger{display:grid}.links{position:fixed;top:70px;inset-inline:0;background:var(--bg);flex-direction:column;align-items:flex-start;padding:20px 24px;gap:18px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:transform .4s;z-index:-1}.links.open{transform:none}}
@media(max-width:960px){.hero .wrap{grid-template-columns:1fr;gap:48px}.hero{padding-bottom:64px}.vis{height:440px}.g3{grid-template-columns:1fr 1fr}.about,.contact{grid-template-columns:1fr;gap:40px}}
@media(max-width:760px){
 section{padding:72px 0}
 .burger{display:grid}
 .links{position:fixed;top:70px;inset-inline:0;background:var(--bg);flex-direction:column;padding:20px 24px;gap:18px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:transform .4s;z-index:-1}
 .links.open{transform:none}
 .g4,.g3,.g2{grid-template-columns:1fr}
 .card{padding:24px}
}
@media(max-width:480px){nav .logo{height:34px}.cta .btn{width:100%;justify-content:center}.setup{padding:18px}.pf .in{flex-wrap:wrap}.chips{margin-top:36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <div class="logo"></div>
</div>

<header>
 <div class="wrap"><nav>
  <a href="#home" class="logo" aria-label="Q-Link"></a>
  <div class="links" id="links">
   <a href="#about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span data-i="n_about"></span></a><a href="#services"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span data-i="n_services"></span></a><a href="#work"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span data-i="n_work"></span></a><a href="#pricing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.600 13.400 13.400 20.600a2 2 0 0 1-2.800 0L2 12V2h10l8.600 8.600a2 2 0 0 1 0 2.800z"/><path d="M7 7h.01"/></svg><span data-i="n_pricing"></span></a><a href="#faq"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.100 9a3 3 0 0 1 5.800 1c0 2-3 3-3 3M12 17h.01"/></svg><span data-i="n_faq"></span></a><a href="#contact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i="n_contact"></span></a>
  </div>
  <div class="tools">
   <button class="ib" id="lang" aria-label="Language">EN</button>
   <button class="ib" id="theme" aria-label="Theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.800z"/></svg>
   </button>
   <button class="ib burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
 </nav></div>
</header>

<main>
<section class="hero" id="home"><div class="wrap">
 <div class="hero-txt">
  <span class="eb ri" style="--i:0"><i></i><span data-i="h_eb"></span></span>
  <h1 class="ri" style="--i:1" data-i="h_title"></h1>
  <p class="ri" style="--i:2" data-i="h_sub"></p>
  <div class="cta ri" style="--i:3">
   <a class="btn" data-wa="order" target="_blank" rel="noopener" data-i="h_cta"></a>
   <a class="btn o" href="#pricing" data-i="h_cta2"></a>
  </div>
  <div class="chips ri" style="--i:4"><span class="chip" data-i="c1"></span><span class="chip" data-i="c2"></span><span class="chip" data-i="c3"></span></div>
 </div>
 <div class="vis ri" style="--i:2" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="phone">
   <div class="ph-top"><div class="logo"></div><span class="dot"></span></div>
   <div class="ph-hero sk"></div>
   <div class="ph-row"><i class="th sk"></i><div><b class="sk w60"></b><b class="sk w40"></b></div><u class="pr"></u></div><div class="ph-row"><i class="th sk"></i><div><b class="sk w60"></b><b class="sk w40"></b></div><u class="pr"></u></div><div class="ph-row"><i class="th sk"></i><div><b class="sk w60"></b><b class="sk w40"></b></div><u class="pr"></u></div>
   <div class="ph-btn"></div>

$$('.logo').forEach(e=>e.innerHTML=logo(!!e.closest('#loader')));
const wa=t=>`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t)}`;

function setLang(l){
  lang=l;try{localStorage.setItem('ql-lang',l)}catch(e){}
  root.lang=l;root.dir=l==='ar'?'rtl':'ltr';
  $$('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
  $$('[data-ph]').forEach(e=>e.placeholder=T[l][e.dataset.ph]);
  $('#lang').textContent=l==='ar'?'EN':'عربي';
  $$('[data-wa]').forEach(a=>{
    const k=a.dataset.wa;
    a.href=wa(k.startsWith('pl')?T[l].wa_plan+T[l][k]:T[l]['wa_'+k]);
  });
}
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem('ql-theme',t)}catch(e){}}

setTheme((()=>{try{return localStorage.getItem('ql-theme')}catch(e){}})()||'dark');
setLang((()=>{try{return localStorage.getItem('ql-lang')}catch(e){}})()||'ar');

$('#lang').onclick=()=>setLang(lang==='ar'?'en':'ar');
$('#theme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');
$('#burger').onclick=()=>$('#links').classList.toggle('open');
$$('#links a').forEach(a=>a.onclick=()=>$('#links').classList.remove('open'));

/* loader: Q expands into Q-Link, then fades out */
const L=$('#loader');
setTimeout(()=>L.classList.add('go'),700);
setTimeout(()=>L.classList.add('done'),3000);
setTimeout(()=>L.remove(),3900);

/* scroll reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
$$('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%4)*80+'ms';io.observe(e)});

/* social pills: tap toggles on touch devices */
$$('.soc button').forEach(b=>b.onclick=()=>{
  const s=b.parentElement,was=s.classList.contains('open');
  $$('.soc').forEach(x=>x.classList.remove('open'));
  if(!was)s.classList.add('open');
});

/* contact form -> WhatsApp */
$('#form').onsubmit=e=>{
  e.preventDefault();const t=T[lang];
  const msg=`${t.wa_name}: ${$('#fn').value}\n${t.wa_svc}: ${$('#fs').value}\n${t.wa_msg}: ${$('#fm').value}`;
  window.open(wa(msg),'_blank','noopener');
};
